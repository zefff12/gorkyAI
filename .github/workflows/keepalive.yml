# Бесплатный Render засыпает после 15 минут без запросов: первое открытие ссылки
# тогда занимает до минуты и выглядит как «сайт не работает», а данные сбрасываются.
# Пинг каждые 10 минут держит сервис включённым (750 бесплатных часов в месяц хватает).
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 https://voice-assistant-vohg.onrender.com/api/health
